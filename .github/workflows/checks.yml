name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ojs: 3_4_0-5
            php: '8.1'
          - ojs: 3_4_0-5
            php: '8.2'
          - ojs: 3_5_0-5
            php: '8.2'
          - ojs: 3_5_0-5
            php: '8.3'
    defaults:
      run:
        working-directory: ojs/plugins/generic/scholar9Review
    steps:
      - name: Checkout OJS test environment
        uses: actions/checkout@v4
        with:
          repository: pkp/ojs
          ref: ${{ matrix.ojs }}
          path: ojs
      - name: Initialize PKP library
        run: git submodule update --init lib/pkp
        working-directory: ojs
      - name: Checkout plugin under test
        uses: actions/checkout@v4
        with:
          path: ojs/plugins/generic/scholar9Review
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, intl, mbstring, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OJS test dependencies
        run: composer install --no-dev --no-scripts --prefer-dist --no-interaction
        working-directory: ojs/lib/pkp
      - run: composer validate --no-check-publish
      - run: find . -name '*.php' -not -path './stubs/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/pluginBootstrap.integration.php
      - run: composer test
      - name: Build installation archive
        shell: pwsh
        run: ./tools/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: scholar9Review-${{ matrix.ojs }}-php-${{ matrix.php }}
          path: ojs/plugins/generic/scholar9Review/.release/*
